<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    {% raw %}
    <div id="app">
        <nav v-if="user" class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <router-link to="/" class="navbar-brand">HMS</router-link>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto" v-if="user.role === 'Admin'">
                        <li class="nav-item">
                            <router-link to="/admin/dashboard" class="nav-link">Dashboard</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/admin/doctors" class="nav-link">Doctors</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/admin/patients" class="nav-link">Patients</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/admin/appointments" class="nav-link">Appointments</router-link>
                        </li>
                    </ul>
                    <ul class="navbar-nav me-auto" v-else-if="user.role === 'Doctor'">
                        <li class="nav-item">
                            <router-link to="/doctor/dashboard" class="nav-link">Dashboard</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/doctor/appointments" class="nav-link">Appointments</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/doctor/availability" class="nav-link">Availability</router-link>
                        </li>
                    </ul>
                    <ul class="navbar-nav me-auto" v-else-if="user.role === 'Patient'">
                        <li class="nav-item">
                            <router-link to="/patient/dashboard" class="nav-link">Dashboard</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/patient/doctors" class="nav-link">Find Doctors</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/patient/appointments" class="nav-link">My Appointments</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link to="/patient/history" class="nav-link">History</router-link>
                        </li>
                    </ul>
                    <div class="navbar-nav ms-auto d-flex flex-row align-items-center">
                        <span class="navbar-text me-3">{{ user.username }} ({{ user.role }})</span>
                        <button @click="logout()" class="btn btn-outline-light btn-sm">Logout</button>
                    </div>
                </div>
            </div>
        </nav>
        <div v-if="error" class="alert alert-danger alert-dismissible fade show m-3" role="alert">
            {{ error }}
            <button type="button" class="btn-close" @click="error = null"></button>
        </div>
        <div v-if="success" class="alert alert-success alert-dismissible fade show m-3" role="alert">
            {{ success }}
            <button type="button" class="btn-close" @click="success = null"></button>
        </div>
        <router-view></router-view>
    </div>
    {% endraw %}
    <script src="/static/js/api/base.js"></script>
    <script src="/static/js/api/auth.js"></script>
    <script src="/static/js/api/admin.js"></script>
    <script src="/static/js/api/doctor.js"></script>
    <script src="/static/js/api/patient.js"></script>
    <script src="/static/js/api/common.js"></script>
    <script src="/static/js/components/auth.js"></script>
    <script src="/static/js/components/admin.js"></script>
    <script src="/static/js/components/doctor.js"></script>
    <script src="/static/js/components/patient.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
